<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <!-- Gradien Berkas Cahaya Lampu Sorot (Persis seperti di iStock) -->
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#ffd166" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#ffd166" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.0" />
    </linearGradient>
    
    <!-- Gradien Casing Lampu Hitam Studio -->
    <linearGradient id="lampBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#495057" />
      <stop offset="50%" stop-color="#212529" />
      <stop offset="100%" stop-color="#111315" />
    </linearGradient>
    
    <!-- Cahaya Lensa Lampu -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
  </defs>

  <!-- 1. Berkas Kerucut Cahaya Kuning Hangat Menembus ke Bawah -->
  <polygon points="182,145 238,192 390,560 50,560" fill="url(#beamGradient)" />
  
  <!-- Sorotan oval di lantai/rumput -->
  <ellipse cx="220" cy="560" rx="170" ry="35" fill="#ffd166" opacity="0.2" />

  <!-- 2. Gantungan Plafon / Bracket Besi Atas -->
  <!-- Plat Tempel Plafon -->
  <rect x="180" y="8" width="40" height="8" rx="2" fill="#1a1d20" />
  <!-- Batang Gantung -->
  <rect x="196" y="16" width="8" height="36" fill="#2b3035" />
  <!-- Baut Putar / Swivel Bracket -->
  <circle cx="200" cy="52" r="7" fill="#495057" />
  <circle cx="200" cy="52" r="3" fill="#adb5bd" />
  
  <!-- Lengan U-Bracket -->
  <path d="M 196,52 L 180,95 L 190,103 L 204,60 Z" fill="#2b3035" />
  <circle cx="194" cy="98" r="6" fill="#6c757d" />
  <circle cx="194" cy="98" r="2.5" fill="#111" />

  <!-- 3. Bodi Lampu Sorot Silinder Hitam Miring 40 Derajat -->
  <g transform="rotate(40, 210, 140)">
    <!-- Sirip Pendingin / Detail Belakang -->
    <rect x="175" y="65" width="50" height="12" rx="3" fill="#1a1d20" />
    <rect x="180" y="60" width="40" height="6" rx="2" fill="#343a40" />
    
    <!-- Tabung Silinder Lampu Utama -->
    <rect x="170" y="75" width="60" height="75" rx="4" fill="url(#lampBody)" />
    <line x1="170" y1="90" x2="230" y2="90" stroke="#111" stroke-width="2" />
    <line x1="170" y1="105" x2="230" y2="105" stroke="#111" stroke-width="2" />
    <line x1="170" y1="120" x2="230" y2="120" stroke="#111" stroke-width="2" />

    <!-- Corong Depan Lampu (Hood / Visor) -->
    <polygon points="165,150 235,150 242,168 158,168" fill="#1a1d20" />

    <!-- Lensa Lampu Menyala Terang -->
    <ellipse cx="200" cy="168" rx="42" ry="12" fill="url(#bulbGlow)" />
    <ellipse cx="200" cy="168" rx="35" ry="8" fill="#ffffff" opacity="0.75" />
  </g>
</svg>